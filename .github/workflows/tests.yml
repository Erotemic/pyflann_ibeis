# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions
# Based on ~/code/xcookie/xcookie/rc/tests.yml.in
# Now based on ~/code/xcookie/xcookie/builders/github_actions.py
# See: https://github.com/Erotemic/xcookie

name: BinPyCI

on:
  push:
    # Restricting push triggers to main avoids running the whole pipeline
    # twice (push + pull_request events) for every push to a PR branch.
    # Feature branches are covered by the pull_request trigger; release
    # branches and tags are handled by release.yml.
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded runs on the same ref are cancelled; deploy-bearing refs never
  # trigger this workflow (release.yml owns them).
  cancel-in-progress: true

jobs:
  lint_job:
    ##
    # Run quick linting and typing checks.
    # To disable all linting add "linter=false" to the xcookie config.
    # To disable type checks add "notypes" to the xcookie tags.
    ##
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source
      uses: actions/checkout@v6.0.2
    - name: Set up Python 3.14 for linting
      uses: actions/setup-python@v6.2.0
      with:
        python-version: '3.14'
    - name: Install dependencies
      run: |-
        python -m pip install pip uv -U
        python -m uv pip install flake8
    - name: Lint with flake8
      run: |-
        # stop the build if there are Python syntax errors or undefined names
        flake8 ./pyflann_ibeis --count --select=E9,F63,F7,F82 --show-source --statistics
    - name: Typecheck with mypy
      run: |-
        python -m pip install mypy
        pip install -r requirements/runtime.txt
        mypy --install-types --non-interactive ./pyflann_ibeis
        mypy ./pyflann_ibeis
  build_and_test_sdist:
    ##
    # Build the binary package from source and test it in the same
    # environment.
    ##
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source
      uses: actions/checkout@v6.0.2
    - name: Set up Python 3.14
      uses: actions/setup-python@v6.2.0
      with:
        python-version: '3.14'
    - name: Upgrade pip
      run: |-
        python -m pip install pip uv -U
        python -m uv pip install -r requirements/tests.txt
        python -m uv pip install -r requirements/runtime.txt
    - name: Build sdist
      shell: bash
      run: |-
        python -m pip install pip uv -U
        python -m uv pip install setuptools>=0.8 wheel build twine
        python -m build --sdist --outdir wheelhouse
        python -m twine check ./wheelhouse/pyflann_ibeis*.tar.gz
    - name: Install sdist
      run: |-
        ls -al wheelhouse
        python -m uv pip install wheelhouse/pyflann_ibeis*.tar.gz -v
    - name: Test minimal loose sdist
      env: {}
      run: |-
        pwd
        ls -al
        # Run in a sandboxed directory
        WORKSPACE_DNAME="testsrcdir_minimal_${CI_PYTHON_VERSION}_${GITHUB_RUN_ID}_${RUNNER_OS}"
        mkdir -p $WORKSPACE_DNAME
        cd $WORKSPACE_DNAME
        # Run the tests
        # Get path to installed package
        MOD_DPATH=$(python -c "import pyflann_ibeis, os; print(os.path.dirname(pyflann_ibeis.__file__))")
        echo "MOD_DPATH = $MOD_DPATH"
        python -m pytest --verbose --cov=pyflann_ibeis $MOD_DPATH ../tests
        cd ..
    - name: Test full loose sdist
      env: {}
      run: |-
        pwd
        ls -al
        true
        # Run in a sandboxed directory
        WORKSPACE_DNAME="testsrcdir_full_${CI_PYTHON_VERSION}_${GITHUB_RUN_ID}_${RUNNER_OS}"
        mkdir -p $WORKSPACE_DNAME
        cd $WORKSPACE_DNAME
        # Run the tests
        # Get path to installed package
        MOD_DPATH=$(python -c "import pyflann_ibeis, os; print(os.path.dirname(pyflann_ibeis.__file__))")
        echo "MOD_DPATH = $MOD_DPATH"
        python -m pytest --verbose --cov=pyflann_ibeis $MOD_DPATH ../tests
        cd ..
    - uses: actions/upload-artifact@v6.0.0
      name: Upload sdist artifact
      with:
        name: sdist_wheels
        path: ./wheelhouse/pyflann_ibeis*.tar.gz
  build_binpy_wheels:
    ##
    # Build the binary wheels. Note: even though cibuildwheel will test
    # them internally here, we will test them independently later in the
    # test_binpy_wheels step.
    ##
    name: ${{ matrix.os }}, arch=${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The wheels are py3-none tagged (pure-ctypes bindings), so a single
        # cibuildwheel build per platform covers every supported Python
        # version. Which interpreter builds the wheel is pinned in the
        # [tool.cibuildwheel] section of pyproject.toml.
        os:
        - ubuntu-latest
        - windows-latest
        arch:
        - auto
    steps:
    - name: Checkout source
      uses: actions/checkout@v6.0.2
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3.0.0
      if: runner.os == 'Linux' && matrix.arch != 'auto'
      with:
        platforms: all
    - name: Expose GitHub Actions cache for vcpkg
      # Lets `vcpkg install` in cibuildwheel's before-all reuse prebuilt lz4
      # binaries via the x-gha binary source instead of compiling every run.
      uses: actions/github-script@v7.0.1
      if: runner.os == 'Windows'
      with:
        script: |-
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
    - name: Build binary wheels
      uses: pypa/cibuildwheel@v3.3.1
      with:
        output-dir: wheelhouse
        config-file: pyproject.toml
      env:
        CIBW_ARCHS_LINUX: ${{ matrix.arch }}
        VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
        CIBW_ARCHS_WINDOWS: AMD64
        CIBW_ENVIRONMENT: PYTHONUTF8=1
        CIBW_ENVIRONMENT_WINDOWS: >-
          PYTHONUTF8=1
          VCPKG_ROOT=C:/vcpkg
          VCPKG_TARGET_TRIPLET=x64-windows
          CMAKE_ARGS=-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
        PYTHONUTF8: '1'
    - name: Show built files
      shell: bash
      run: ls -la wheelhouse
    # Coverage is collected and uploaded by the test_binpy_wheels job; the
    # build job only runs a quick smoke test which produces no coverage.
    - uses: actions/upload-artifact@v6.0.0
      name: Upload wheels artifact
      with:
        name: wheels-${{ matrix.os }}-${{ matrix.arch }}
        path: ./wheelhouse/pyflann_ibeis*.whl
  test_binpy_wheels:
    ##
    # Download the previously build binary wheels from the
    # build_binpy_wheels step, and test them in an independent
    # environment.
    ##
    name: ${{ matrix.python-version }} on ${{ matrix.os }}, arch=${{ matrix.arch }} with ${{ matrix.install-extras }}
    runs-on: ${{ matrix.os }}
    needs:
    - build_binpy_wheels
    strategy:
      fail-fast: false
      matrix:
        # Xcookie generates an explicit list of environments that will be used
        # for testing instead of using the more concise matrix notation.
        include:
        - python-version: '3.11'
          install-extras: tests-strict,runtime-strict
          os: ubuntu-latest
          arch: auto
        - python-version: '3.13'
          install-extras: tests-strict,runtime-strict,optional-strict
          os: ubuntu-latest
          arch: auto
        - python-version: '3.11'
          install-extras: tests,optional
          os: ubuntu-latest
          arch: auto
        - python-version: '3.12'
          install-extras: tests,optional
          os: ubuntu-latest
          arch: auto
        - python-version: '3.13'
          install-extras: tests,optional
          os: ubuntu-latest
          arch: auto
        - python-version: '3.14'
          install-extras: tests,optional
          os: ubuntu-latest
          arch: auto
        - python-version: '3.11'
          install-extras: tests,optional,runtime-strict
          os: windows-latest
          arch: auto
        - python-version: '3.12'
          install-extras: tests,optional,runtime-strict
          os: windows-latest
          arch: auto
        - python-version: '3.13'
          install-extras: tests,optional,runtime-strict
          os: windows-latest
          arch: auto
        - python-version: '3.14'
          install-extras: tests,optional,runtime-strict
          os: windows-latest
          arch: auto
    steps:
    - name: Checkout source
      uses: actions/checkout@v6.0.2
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3.0.0
      if: runner.os == 'Linux' && matrix.arch != 'auto'
      with:
        platforms: all
    - name: Setup Python
      uses: actions/setup-python@v6.2.0
      with:
        python-version: ${{ matrix.python-version }}
    - uses: actions/download-artifact@v7.0.0
      name: Download wheels
      with:
        pattern: wheels-*
        merge-multiple: true
        path: wheelhouse
    - name: Install wheel ${{ matrix.install-extras }}
      shell: bash
      env:
        INSTALL_EXTRAS: ${{ matrix.install-extras }}
      run: |-
        echo "Finding the path to the wheel"
        ls wheelhouse || echo "wheelhouse does not exist"
        echo "Installing helpers: update pip"
        python -m pip install pip uv -U
        echo "Installing helpers: setuptools"
        python -m uv pip install setuptools>=0.8 setuptools_scm wheel build -U
        echo "Installing helpers: tomli and pkginfo"
        python -m uv pip install tomli pkginfo
        export WHEEL_FPATH=$(python -c "if 1:
            import pathlib
            from packaging import tags
            from packaging.utils import parse_wheel_filename
            dist_dpath = pathlib.Path('wheelhouse')
            candidates = list(dist_dpath.glob('pyflann_ibeis*.whl'))
            candidates += list(dist_dpath.glob('pyflann_ibeis*.tar.gz'))
            sys_tags = {str(t) for t in tags.sys_tags()}
            matching = []
            for wheel in candidates:
                if wheel.suffix != '.whl':
                    continue
                try:
                    _, _, _, wheel_tags = parse_wheel_filename(wheel.name)
                except ValueError:
                    _, _, wheel_tags = parse_wheel_filename(wheel.name)
                if any(str(tag) in sys_tags for tag in wheel_tags):
                    matching.append(wheel)
            if matching:
                candidates = matching
            else:
                candidates = [w for w in candidates if w.suffix == '.whl']
            if not candidates:
                raise SystemExit('No wheel artifacts found')
            fpath = sorted(candidates)[-1]
            print(str(fpath).replace(chr(92), chr(47)))
        ")
        export MOD_VERSION=$(python -c "if 1:
            from pkginfo import Wheel
            fpath = '$WHEEL_FPATH'
            if not fpath:
                raise SystemExit('WHEEL_FPATH is empty')
            item = Wheel(fpath)
            print(item.version)
        ")
        echo "WHEEL_FPATH=$WHEEL_FPATH"
        echo "INSTALL_EXTRAS=$INSTALL_EXTRAS"
        echo "UV_RESOLUTION=$UV_RESOLUTION"
        echo "MOD_VERSION=$MOD_VERSION"
        python -m uv pip install --prerelease=allow "pyflann_ibeis[$INSTALL_EXTRAS]==$MOD_VERSION" -f wheelhouse
        echo "Install finished."
    - name: Smoke test wheel on Windows
      if: runner.os == 'Windows'
      shell: bash
      run: |-
        # Windows smoke test: validate import/extension load before full pytest.
        python - <<'PY'
        import os
        import sys
        repo_dir = os.path.abspath(os.getcwd())
        sys.path = [p for p in sys.path if os.path.abspath(p) != repo_dir]
        import pyflann_ibeis
        from pyflann_ibeis import flann_ctypes
        assert flann_ctypes.flannlib is not None, "Failed to load flann library"
        print("Loaded flann library from:", flann_ctypes.libpath)
        PY
    - name: Test wheel ${{ matrix.install-extras }}
      shell: bash
      env:
        CI_PYTHON_VERSION: py${{ matrix.python-version }}
      run: |-
        echo "Creating test sandbox directory"
        export WORKSPACE_DNAME="testdir_${CI_PYTHON_VERSION}_${GITHUB_RUN_ID}_${RUNNER_OS}"
        echo "WORKSPACE_DNAME=$WORKSPACE_DNAME"
        mkdir -p $WORKSPACE_DNAME
        echo "cd-ing into the workspace"
        cd $WORKSPACE_DNAME
        pwd
        ls -altr
        # Get the path to the installed package and run the tests
        export MOD_DPATH=$(python -c "import pyflann_ibeis, os; print(os.path.dirname(pyflann_ibeis.__file__))")
        export MOD_NAME=pyflann_ibeis
        echo "
        ---
        MOD_DPATH = $MOD_DPATH
        ---
        running the pytest command inside the workspace
        ---
        "
        python -m pytest --verbose -p pytester -p no:doctest --xdoctest --cov-config ../pyproject.toml --cov-report term --durations=100 --cov="$MOD_NAME" "$MOD_DPATH" ../tests
        echo "pytest command finished, moving the coverage file to the repo root"
        ls -al
        # Move coverage file to a new name
        mv .coverage "../.coverage.$WORKSPACE_DNAME"
        echo "changing directory back to th repo root"
        cd ..
        ls -al
    - name: Combine coverage Linux
      if: runner.os == 'Linux'
      run: |-
        echo '############ PWD'
        pwd
        cp .wheelhouse/.coverage* . || true
        ls -al
        uv pip install coverage[toml] | pip install coverage[toml]
        echo '############ combine'
        coverage combine . || true
        echo '############ XML'
        coverage xml -o ./coverage.xml || true
        echo '### The cwd should now have a coverage.xml'
        ls -altr
        pwd
    - uses: codecov/codecov-action@v5.5.2
      name: Codecov Upload
      with:
        file: ./coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
