[build-system]
requires = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[project]
name = "pyflann_ibeis"
version = "2.4.3"
description = "FLANN (for IBEIS) - Fast Library for Approximate Nearest Neighbors"
readme = "README.rst"
requires-python = ">=3.9"
license = { text = "BSD" }
authors = [
  { name = "Jon Crall" },
  { name = "Marius Muja" },
]
classifiers = [
  "Development Status :: 6 - Mature",
  "License :: OSI Approved :: BSD License",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: Unix",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  "numpy>=2.1.0     ; python_version < '4.0'  and python_version >= '3.13'",
  "numpy>=1.26.0    ; python_version < '3.13' and python_version >= '3.12'",
  "numpy>=1.23.2  ; python_version < '3.12' and python_version >= '3.11'",
  "numpy>=1.21.6  ; python_version < '3.11' and python_version >= '3.10'",
  "numpy>=1.19.3  ; python_version < '3.10' and python_version >= '3.9'",
  "numpy>=1.19.3  ; python_version < '3.9' and python_version >= '3.8'",
]

[project.urls]
Homepage = "https://github.com/Erotemic/pyflann_ibeis"
Repository = "https://github.com/Erotemic/pyflann_ibeis"

[project.optional-dependencies]
