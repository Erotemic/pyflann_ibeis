  "coverage>=7.0.0     ; python_version < '4.0'  and python_version >= '3.11'",
  "coverage>=6.1.1     ; python_version < '3.11' and python_version >= '3.10'",
  "coverage>=5.3.1     ; python_version < '3.10' and python_version >= '3.9'",
  "coverage>=6.1.1     ; python_version < '3.9' and python_version >= '3.8'",
  "coverage>=6.1.1     ; python_version < '3.8' and python_version >= '3.7'",
  "coverage>=6.1.1     ; python_version < '3.7' and python_version >= '3.6'",
  "coverage>=5.3.1     ; python_version < '3.6' and python_version >= '3.5'",
  "coverage>=4.3.4     ; python_version < '3.5' and python_version >= '3.4'",
  "coverage>=5.3.1     ; python_version < '3.4' and python_version >= '2.7'",
  "coverage>=4.5       ; python_version < '2.7' and python_version >= '2.6'",
  "cibuildwheel>=2.17.0",
  "scikit-build-core>=0.11",
  "cmake",
  "ninja",
