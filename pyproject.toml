  "pytest>=4.6.0, <= 4.6.11 ; python_version < '2.8.0'  and python_version >= '2.7.0'",
  "pytest-cov>=3.0.0           ;                               python_version >= '3.6.0'",
  "pytest-cov>=2.9.0           ; python_version < '3.6.0'  and python_version >= '3.5.0'",
  "pytest-cov>=2.8.1           ; python_version < '3.5.0'  and python_version >= '3.4.0'",
